<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSIYC article gallery</title>
<style>
  :root { --navy:#1B3870; --line:#E2E6EE; --ink:#3D4451; --muted:#7F7F7F; --paper:#F4F6FA; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  header { background:var(--navy); color:#fff; padding:20px 30px; }
  header h1 { margin:0; font-size:21px; letter-spacing:.02em; }
  header p { margin:6px 0 0; font-size:13px; opacity:.82; }
  header a { color:#fff; font-size:13px; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.5); }
  main { max-width:1240px; margin:0 auto; padding:24px 30px 60px; }
  .summary { display:flex; gap:18px; flex-wrap:wrap; margin:0 0 20px; font-size:13px; color:var(--muted); }
  .summary b { color:var(--navy); font-size:19px; display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
  .card { background:#fff; border-radius:10px; overflow:hidden;
          box-shadow:0 2px 10px rgba(16,32,64,.08); display:flex; flex-direction:column; }
  .thumb { display:block; background:#e8ecf3; aspect-ratio:1240/1754; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .thumb.empty { display:flex; align-items:center; justify-content:center; color:var(--muted);
                 font-size:12.5px; height:220px; aspect-ratio:auto; }
  .body { padding:14px 16px 16px; flex:1; display:flex; flex-direction:column; }
  .title { font-size:15.5px; font-weight:700; color:#141414; line-height:1.45; margin:0 0 4px; }
  .title-en { font-size:12.5px; color:var(--muted); margin:0 0 10px; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .tag { font-size:11px; padding:2px 8px; border-radius:999px; background:#EEF2F8; color:var(--navy); }
  .tag.ok { background:#E7F5EC; color:#1E7A43; }
  .tag.bad { background:#FDECEA; color:#B3253A; }
  .tag.warn { background:#FDF3E2; color:#8A6210; }
  .facts { font-size:12px; color:var(--muted); line-height:1.7; margin:0 0 12px; }
  .links { margin-top:auto; display:flex; flex-wrap:wrap; gap:8px; }
  .links a { font-size:12px; text-decoration:none; color:var(--navy); border:1px solid var(--line);
             border-radius:6px; padding:4px 9px; }
  .links a:hover { background:var(--paper); }
  .empty-state { background:#fff; border-radius:10px; padding:30px; text-align:center; color:var(--muted); }
  .err { color:#B3253A; }
</style>
</head>
<body>
<header>
  <h1>HSIYC 文章与视觉 · Articles &amp; artwork</h1>
  <p>Everything the agent has produced, newest first.
     <a href="/">New article</a> · <a href="/legacy">Free-form brief</a></p>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function pick(files, suffix) {
  return (files || []).find((f) => f.endsWith(suffix)) || '';
}

function scoreTag(b) {
  if (b.score === null || b.score === undefined) return '<span class="tag">no check yet</span>';
  const cls = (b.errors || 0) > 0 ? 'bad' : ((b.warnings || 0) > 0 ? 'warn' : 'ok');
  const detail = `${b.errors ?? 0} error(s) · ${b.warnings ?? 0} warning(s)`;
  return `<span class="tag ${cls}" title="${esc(detail)}">${b.score}/100</span>`;
}

async function load() {
  const data = await (await fetch('/api/bundles')).json();
  const bundles = data.bundles || [];
  const errors = bundles.reduce((n, b) => n + (b.errors || 0), 0);
  const clean = bundles.filter((b) => !b.errors).length;
  $('summary').innerHTML =
    `<div><b>${bundles.length}</b> article(s)</div>
     <div><b>${clean}</b> with 0 errors</div>
     <div><b>${errors}</b> open error(s)</div>
     <div><b>${bundles.filter((b) => b.poster).length}</b> with artwork</div>`;

  if (!bundles.length) {
    $('empty').style.display = '';
    $('empty').textContent = 'Nothing yet. Write an article and it will appear here.';
    return;
  }

  $('grid').innerHTML = bundles.map((b) => {
    const slug = esc(b.slug);
    const links = [
      pick(b.files, '.preview.html'), pick(b.files, '.pdf'), pick(b.files, '.docx'),
      pick(b.files, '.pptx'), pick(b.files, '.md'),
    ].filter(Boolean).map((f) =>
      `<a href="/file/${slug}/${esc(f)}" target="_blank">${esc(f.split('.').pop().toUpperCase())}</a>`).join('');
    const thumb = b.poster
      ? `<a class="thumb" href="${esc(b.poster)}" target="_blank"><img loading="lazy"
           src="${esc(b.poster)}" alt="${esc(b.title_cn)}"></a>`
      : '<div class="thumb empty">no artwork generated</div>';
    return `<div class="card">${thumb}<div class="body">
      <p class="title">${esc(b.title_cn || b.slug)}</p>
      ${b.title_en ? `<p class="title-en">${esc(b.title_en)}</p>` : ''}
      <div class="meta">
        ${b.doc_type ? `<span class="tag">${esc(b.doc_type)}</span>` : ''}
        ${b.vibe_label ? `<span class="tag">${esc(b.vibe_label)}</span>` : ''}
        ${scoreTag(b)}
      </div>
      <p class="facts">
        ${b.event_date ? `${esc(b.event_date)}<br>` : ''}
        ${b.venue ? `${esc(b.venue)}<br>` : ''}
        <span style="color:#A6AEBC">${esc(b.slug)}</span>
      </p>
      <div class="links">${links || '<span class="err">no output files</span>'}</div>
    </div></div>`;
  }).join('');
}

load().catch((e) => {
  $('empty').style.display = '';
  $('empty').innerHTML = `<span class="err">Could not load the gallery: ${esc(e)}</span>`;
});
</script>
</body>
</html>
