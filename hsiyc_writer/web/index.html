<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSIYC 文章助手 · Article Writer</title>
<style>
  :root {
    --navy: #1B3870;          /* brand navy, measured from the approved articles */
    --navy-soft: #20314B;     /* card-border navy */
    --ink: #4C4C4C;           /* body text */
    --h1: #141414;
    --grey: #7F7F7F;
    --line: #E2E6EE;
    --ok: #1a8f4c;
    --bad: #c0392b;
    --warn: #b7791f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  header {
    border-bottom: 1px solid var(--line); padding: 18px 28px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 19px; color: var(--h1); margin: 0; font-weight: 700; }
  header .en { font-size: 12px; color: var(--grey); letter-spacing: .06em; }
  header .spacer { flex: 1; }
  .status { font-size: 12.5px; color: var(--grey); }
  .status b { color: var(--navy); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(360px, 460px) 1fr; gap: 0; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .pane { padding: 24px 28px 60px; }
  .pane.left { border-right: 1px solid var(--line); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin: 18px 0 6px; }
  label .hint { font-weight: 400; color: var(--grey); font-size: 12px; }
  textarea, input[type=text], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; font-size: 14px; color: var(--ink); background: #fff;
  }
  textarea { min-height: 230px; resize: vertical; line-height: 1.7; }
  textarea:focus, input:focus, select:focus { outline: 2px solid #c8d5e8; border-color: var(--navy); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .drop {
    border: 1px dashed #b9c4d6; border-radius: 8px; padding: 18px; text-align: center;
    color: var(--grey); font-size: 13px; background: #fafbfd; cursor: pointer;
  }
  .drop.over { border-color: var(--navy); background: #f2f6fd; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumb { position: relative; width: 74px; height: 74px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 2px; right: 2px; border: 0; border-radius: 50%; width: 20px; height: 20px;
    background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 12px; line-height: 1;
  }
  button.primary {
    margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 6px;
    background: var(--navy); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { background: #9aa8bf; cursor: default; }
  .log { margin-top: 16px; font-size: 12.5px; color: var(--grey); white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin-bottom: 18px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--h1); }
  .score { font-size: 34px; font-weight: 700; line-height: 1; }
  .score.ok { color: var(--ok); } .score.bad { color: var(--bad); }
  .score small { font-size: 14px; color: var(--grey); font-weight: 400; }
  .finding { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .finding:last-child { border-bottom: 0; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 3px; }
  .tag.error { background: #fdecea; color: var(--bad); }
  .tag.warning { background: #fdf6e3; color: var(--warn); }
  .tag.info { background: #eef1f6; color: var(--ink); }
  .code { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--grey); }
  .hintline { color: var(--grey); font-size: 12.5px; margin-top: 3px; }
  .files a { display: inline-block; margin: 4px 10px 4px 0; font-size: 13px; color: var(--navy); }
  .stats { font-size: 12.5px; color: var(--grey); }
  iframe.preview { width: 100%; height: 82vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .empty { color: var(--grey); font-size: 14px; }
  .needs { background: #fffbf0; border: 1px solid #f0dfb4; border-radius: 8px; padding: 14px 18px; }
  .needs h2 { color: var(--warn); }
  .needs li { margin-bottom: 5px; font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .tabs button {
    border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 6px;
    cursor: pointer; font-size: 13px; color: var(--ink);
  }
  .tabs button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .md { white-space: pre-wrap; font-size: 13.5px; line-height: 1.75; max-height: 82vh; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>HSIYC 文章助手</h1>
  <span class="en">HITSZ INTERNATIONAL YOUTH CLUB · ARTICLE WRITER</span>
  <span class="spacer"></span>
  <span class="status" id="status">connecting…</span>
</header>

<main>
  <section class="pane left">
    <label>活动信息 <span class="hint">/ event brief — paste everything you know: date, venue, who, how many, winners, partners, reviewers</span></label>
    <textarea id="brief" placeholder="例：
活动名称：APEC 智慧校园创新系列——积分蜜蜂赛
时间：2026年11月8日 14:00-17:00
地点：哈工大（深圳）A509
参赛人数：32 名参赛者，4 位进入决赛
获奖名单：冠军 Tugsuu Rentsennatsag；亚军 Brandon Mantovanni Yunata
评委：凌怡老师
合办：国际教育中心、AcademiaSphere
文字：Zhumabay Aruzhan
图片：Yalalt
排版：Zhumabay Aruzhan
一审：Samin、柯炽炜
二审：周宣彤、崔雨旸、高容驷
三审：卢锦章"></textarea>

    <div class="row">
      <div>
        <label>文章类型 <span class="hint">/ type</span></label>
        <select id="doc_type">
          <option value="">自动判断 / auto</option>
          <option value="回顾">回顾 recap</option>
          <option value="预告">预告 preview</option>
          <option value="招募">招募 recruitment</option>
          <option value="收官">收官 closing</option>
          <option value="喜报">喜报 good news</option>
          <option value="竞赛">竞赛 competition</option>
          <option value="活动">活动 event</option>
        </select>
      </div>
      <div>
        <label>自动修正次数 <span class="hint">/ repair rounds</span></label>
        <select id="repair_rounds">
          <option value="1" selected>1</option>
          <option value="0">0</option>
          <option value="2">2</option>
        </select>
      </div>
    </div>

    <label>活动照片 <span class="hint">/ event photos — the agent looks at them to place and caption them</span></label>
    <div class="drop" id="drop">
      点击选择或拖拽图片到这里 · 支持 JPG / PNG / WebP
      <input type="file" id="files" accept="image/*" multiple hidden>
    </div>
    <div class="thumbs" id="thumbs"></div>

    <button class="primary" id="go">生成文章 / Generate</button>
    <div class="log" id="log"></div>
  </section>

  <section class="pane right" id="out">
    <p class="empty">生成结果会显示在这里。文章会自动检查后写入 output/ 目录。<br>
    <span style="font-size:13px">The result, the pre-submission check and the output files will appear here.</span></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let selected = [];

async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    $('status').innerHTML = s.key_present
      ? `key <b>${s.key_masked}</b> · 范本 <b>${s.corpus_size}</b> 篇 · 模型 <b>${s.text_model}</b>` + (s.vision_enabled ? ` + 识图 <b>${s.vision_model}</b>` : '')
      : '<span style="color:#c0392b">未配置 API key / no API key — set DEEPSEEK_API_KEY</span>';
  } catch (e) {
    $('status').textContent = 'server unreachable';
  }
}
refreshStatus();

$('drop').addEventListener('click', () => $('files').click());
$('files').addEventListener('change', (e) => addFiles([...e.target.files]));
['dragenter', 'dragover'].forEach(ev => $('drop').addEventListener(ev, (e) => {
  e.preventDefault(); $('drop').classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, (e) => {
  e.preventDefault(); $('drop').classList.remove('over');
}));
$('drop').addEventListener('drop', (e) => addFiles([...e.dataTransfer.files]));

function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith('image/')) continue;
    if (selected.some(s => s.name === f.name && s.size === f.size)) continue;
    selected.push(f);
  }
  renderThumbs();
}
function renderThumbs() {
  const box = $('thumbs');
  box.innerHTML = '';
  selected.forEach((f, i) => {
    const url = URL.createObjectURL(f);
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<img src="${url}" alt=""><button title="移除">×</button>`;
    d.querySelector('button').onclick = () => { selected.splice(i, 1); renderThumbs(); };
    box.appendChild(d);
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function renderResult(res, files) {
  const chk = res.check || {};
  const score = chk.score ?? 0;
  const cls = chk.ok ? 'ok' : 'bad';
  let html = '';

  html += `<div class="card">
    <h2>送审前自检 / Pre-submission check</h2>
    <div class="score ${cls}">${score}<small> / 100</small></div>
    <p style="margin:10px 0 4px">${chk.errors ?? 0} 个错误 · ${chk.warnings ?? 0} 个提醒 · ${chk.infos ?? 0} 条备注</p>
    <p style="margin:0;font-size:13.5px">${chk.ok
      ? '结构上可以送审，但请人工通读一遍。/ Structurally ready for review.'
      : '请先修正下面的错误再送审。/ Fix the errors below before sending to the youth committee.'}</p>
    <div class="stats" style="margin-top:12px">${esc(Object.entries(chk.stats || {}).map(([k, v]) => `${k}: ${v}`).join(' · '))}</div>
  </div>`;

  const findings = (chk.findings || []).filter(f => f.severity !== 'info');
  if (findings.length) {
    html += '<div class="card"><h2>检查明细 / Findings</h2>';
    for (const f of findings) {
      html += `<div class="finding"><span class="tag ${f.severity}">${f.severity === 'error' ? 'ERROR' : 'WARN'}</span>
        <span class="code">${esc(f.code)}</span> — ${esc(f.message)}
        ${f.location ? `<em style="color:#7F7F7F">(${esc(f.location)})</em>` : ''}
        ${f.hint ? `<div class="hintline">→ ${esc(f.hint)}</div>` : ''}</div>`;
    }
    html += '</div>';
  }

  const needs = res.needs_editor || [];
  if (needs.length) {
    html += `<div class="needs"><h2>需人工确认 / For the editor</h2><ul>${needs.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`;
  }

  const pr = res.photo_report && res.photo_report.photos;
  if (pr && pr.length) {
    html += `<div class="card"><h2>图片识别 / What the photos show</h2>
      <p class="hintline">Agent 逐张看过上传的照片，图片说明与照片位置基于此。/ Captions and placement are based on this reading.</p>`;
    for (const p of pr) {
      html += `<div class="finding"><b>${esc(p.file)}</b> <span class="code">${esc(p.usable_as || '')}</span>
        <div>${esc(p.scene || '')}</div>
        ${p.people ? `<div class="hintline">people: ${esc(p.people)}</div>` : ''}
        ${(p.visible_text || []).length ? `<div class="hintline">visible text: ${esc((p.visible_text || []).join(' · '))}</div>` : ''}
        ${p.suggested_caption_cn ? `<div class="hintline">建议图注: ${esc(p.suggested_caption_cn)}</div>` : ''}</div>`;
    }
    html += '</div>';
  }

  const t = res.article?.title || {};
  html += `<div class="card"><h2>标题 / Headline</h2>
    <div style="font-size:17px;font-weight:700;color:var(--h1)">${esc(t.cn)}</div>
    ${t.en ? `<div style="color:#7F7F7F;font-size:13px;margin-top:4px">${esc(t.en)}</div>` : ''}
    <div class="stats" style="margin-top:8px">范本 / exemplars: ${esc((res.exemplars || []).join(', ') || '—')} ·
      重试 ${res.attempts ?? 1} 次 · ${res.usage?.total_tokens ?? 0} tokens · ${res.usage?.elapsed_s ?? '?'}s</div>
  </div>`;

  if (files && files.length) {
    html += `<div class="card"><h2>输出文件 / Output files</h2><div class="files">
      ${files.map(f => `<a href="/file/${f}" target="_blank">${esc(f.split('/').pop())}</a>`).join('')}
    </div><p class="hintline">HTML 可直接预览，DOCX 可交给排版同学，PDF 可发给评审。</p></div>`;
  }

  html += `<div class="card"><h2>预览 / Preview</h2>
    <div class="tabs">
      <button class="active" data-t="html">渲染预览</button>
      <button data-t="md">Markdown</button>
    </div>
    <div id="pane-html"><iframe class="preview" src="/file/${files?.find(f => f.endsWith('.preview.html')) || ''}"></iframe></div>
    <pre class="md" id="pane-md" style="display:none"></pre>
  </div>`;

  $('out').innerHTML = html;

  $('out').querySelectorAll('.tabs button').forEach(b => {
    b.onclick = async () => {
      $('out').querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
      const htmlPane = $('pane-html'), mdPane = $('pane-md');
      if (b.dataset.t === 'html') { htmlPane.style.display = ''; mdPane.style.display = 'none'; return; }
      htmlPane.style.display = 'none'; mdPane.style.display = '';
      if (!mdPane.dataset.loaded) {
        const md = files?.find(f => f.endsWith('.md'));
        if (md) {
          const r = await fetch('/file/' + md);
          mdPane.textContent = await r.text();
          mdPane.dataset.loaded = '1';
        }
      }
    };
  });
}

$('go').onclick = async () => {
  const brief = $('brief').value.trim();
  if (brief.length < 30) { alert('请多写一点活动信息 / please describe the event in more detail'); return; }
  const btn = $('go');
  btn.disabled = true; btn.textContent = '生成中… / generating…';
  $('log').textContent = '';
  $('out').innerHTML = '<p class="empty">正在生成，请稍候（通常 30-90 秒）。</p>';

  const fd = new FormData();
  fd.append('brief', brief);
  fd.append('doc_type', $('doc_type').value);
  fd.append('repair_rounds', $('repair_rounds').value);
  selected.forEach(f => fd.append('photos', f, f.name));

  try {
    const r = await fetch('/api/generate', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    const id = j.job_id;
    let dots = 0;
    while (true) {
      await new Promise(res => setTimeout(res, 1200));
      const s = await (await fetch('/api/job/' + id)).json();
      $('log').textContent = (s.progress || []).join('\n');
      if (s.status === 'done') {
        const files = await listFiles(s.output_dir);
        renderResult(s.result, files);
        break;
      }
      if (s.status === 'error') throw new Error(s.error);
      dots = (dots + 1) % 4;
      btn.textContent = '生成中' + '.'.repeat(dots + 1) + ' / generating';
    }
  } catch (e) {
    $('out').innerHTML = `<div class="card"><h2 style="color:#c0392b">生成失败 / Failed</h2>
      <p style="font-size:13.5px">${esc(e.message)}</p>
      <p class="hintline">检查 API key、网络，或查看终端输出。</p></div>`;
  } finally {
    btn.disabled = false; btn.textContent = '生成文章 / Generate';
  }
};

async function listFiles(dir) {
  // The server exposes files under /file/<slug>/<name>; ask it for the manifest.
  if (!dir) return [];
  const r = await fetch('/api/files?dir=' + encodeURIComponent(dir));
  if (!r.ok) return [];
  const j = await r.json();
  return j.files || [];
}
</script>
</body>
</html>
